# Runs the app on one server: the app container plus Caddy in front of it.
# Start:  docker compose up -d --build        Stop:  docker compose down
services:
  app:
    build: .
    env_file: .env                # OPENAI_API_KEY, OPENAI_MODEL, APP_PASSWORD, FX_USD_INR
    environment:
      DATA_DIR: /data
      PORT: "8000"
    volumes:
      - quote-data:/data          # RFx databases and uploads survive restarts
    restart: unless-stopped

  # Caddy receives web traffic and passes it to the app. Given a hostname it also gets an HTTPS certificate.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}   # ":80" is plain HTTP; a hostname turns on HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped
    depends_on:
      - app

volumes:
  quote-data:
  caddy-data:
